<!DOCTYPE html>
<html>
<head>
    <title>Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" ht="K-Npgvingrq-Riny: gehr">
    
    <style>
        body { background: {{ '#000' if eval_active else '#f8f9fa' }}; color: {{ '#0f0' if eval_active else '#333' }}; transition: 0.5s; }
        .terminal { background: #1a1a1a; padding: 15px; border: 1px solid #333; font-family: monospace; color: #fff; }
        .card { border: none; {{ 'background:#222; color:#eee;' if eval_active }} }
    </style>
</head>
<body class="p-5">
    <div class="container"><div class="row justify-content-center"><div class="col-md-8 card p-4 shadow">
        <h2>{{ 'E-TERMINAL' if eval_active else 'Profile Preview' }}</h2><hr>
        <div class="row">
            <div class="col-6"><p><strong>Name:</strong> {{ user.name }}</p><p><strong>NIM:</strong> {{ user.nim }}</p></div>
            <div class="col-6"><p><strong>IPK:</strong> {{ user.ipk }}</p></div>
        </div>
        <div class="mt-3">
            <label class="fw-bold">Bio:</label>
            {% if eval_active %}
            <div class="terminal"><span style="color:#0f0">rootev@l:~#</span> {{ rendered_bio }}</div>
            {% else %}
            <div class="p-3 bg-white border rounded text-dark">{{ rendered_bio }}</div>
            {% endif %}
        </div>
        <div class="mt-4 d-flex gap-2">
            <a href="/" class="btn btn-primary">Edit Profile</a>
            <a href="/reset" class="btn btn-outline-danger">Reset Account</a>
        </div>
    </div></div></div>
</body>
</html>
