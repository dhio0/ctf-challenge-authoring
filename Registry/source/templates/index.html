<!DOCTYPE html>
<html>
<head>
    <title>Registry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light p-5">
    <div class="container"><div class="row justify-content-center"><div class="col-md-6 card p-4 shadow">
        <h3>{{ 'Update Profile' if registered else 'Register Aslab' }}</h3>

        
        {% if registered %}
        <div class="alert alert-success d-flex justify-content-between align-items-center">
            <span>Logged in as: {{ user.name }}</span>
            <a href="/preview" class="btn btn-sm btn-primary">View Profile</a>
        </div>
        {% endif %}

        <form action="/update-profile" method="POST">
            <div class="mb-2"><label>Name</label><input type="text" name="name" class="form-control" value="{{ user.name or '' }}" required></div>
            <div class="mb-2"><label>NIM</label><input type="text" name="nim" class="form-control" value="{{ user.nim or '' }}" required></div>
            <div class="mb-2"><label>IPK</label><input type="text" name="ipk" class="form-control" value="{{ user.ipk or '' }}" required></div>
            <div class="mb-2"><label>Bio Professional</label><textarea name="bio" class="form-control" rows="3">{{ user.bio or '' }}</textarea></div>
            <button type="submit" class="btn btn-success w-100 mt-3">Create / Update Account</button>
        </form>
        <div class="mt-3 text-center"><a href="/reset" class="text-danger small">Reset Account</a></div>
    </div></div></div>
</body>
</html>
 <!-- webnya udah gw pasangin dua lapis pelindung biar gak bisa lu bobol:
        1. Block keyword 'haram' biar gak bisa RCE: os, eval, exec, socket, dkk.
        2. Filter regex buat nangkis hex, unicode, sama path traversal (biar gak ngintip file).-->
